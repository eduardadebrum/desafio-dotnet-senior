name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-unitarios:
    name: Linux / Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build legado/NotaCarioca.sln -c Release
      - name: Testes unitários
        run: dotnet test legado/tests/NotaCarioca.Testes -c Release -f net8.0 --no-build

  linux-integracao:
    name: Linux / Testes de integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build legado/NotaCarioca.sln -c Release
      - name: Testes de integração
        run: dotnet test legado/tests/NotaCarioca.Testes.Integracao -c Release -f net8.0 --no-build

  windows-unitarios:
    name: Windows / Testes unitários (net48)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build legado/NotaCarioca.sln -c Release
      - name: Testes unitários
        run: dotnet test legado/tests/NotaCarioca.Testes -c Release -f net48 --no-build
